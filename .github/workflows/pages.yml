name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/eco-arb-hackathon-3knnwn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # The standalone single-file demo ships alongside the app so it stays
      # reachable at /demo/ when the hosted app is the site root.
      - run: |
          mkdir -p frontend/dist/demo
          cp demo/eco-arb-terminal.html frontend/dist/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages has to be switched on by hand once (Settings -> Pages -> Source:
    # GitHub Actions). Until that happens actions/deploy-pages returns 404 and
    # would redden the whole repo, so the deployment is advisory: the build
    # above still fails loudly on a genuine breakage. Drop this line once Pages
    # is enabled if you want a failed deployment to fail the run.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
