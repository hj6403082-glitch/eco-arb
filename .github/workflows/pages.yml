name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # The standalone single-file demo ships alongside the app so it stays
      # reachable at /demo/ when the hosted app is the site root.
      - run: |
          mkdir -p frontend/dist/demo
          cp demo/eco-arb-terminal.html frontend/dist/demo/index.html
      # A CNAME makes GitHub 301 the github.io URL to the custom domain, so
      # writing one before DNS resolves leaves BOTH URLs looking broken. It is
      # therefore gated on a repository variable: set CUSTOM_DOMAIN (Settings ->
      # Secrets and variables -> Actions -> Variables) once the DNS records
      # answer, and the next deploy picks the domain up. Until then the site
      # serves at the github.io URL and is reachable throughout.
      - name: Attach the custom domain, if one is configured
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > frontend/dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No longer advisory. Pages is enabled on this repository and this job has
    # deployed successfully, so a failure here is a real failure and should
    # redden the run rather than pass quietly.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
